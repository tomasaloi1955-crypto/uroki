name: Распознать записи голоса

on:
  push:
    paths: ["voice/**.m4a", "voice/**.mp3", "voice/**.ogg", "voice/**.opus", "voice/**.wav"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcribe-voice
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Устанавливаем faster-whisper
        run: pip install faster-whisper
      - name: Распознаём новые записи
        run: python transcribe_voice.py
      - name: Сохраняем тексты с таймингами
        run: |
          git config user.name "autopost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add voice/*.words.json
          git diff --cached --quiet || git commit -m "Распознаны записи голоса"
          git pull --rebase && git push
