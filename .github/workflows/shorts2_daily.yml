name: Ежедневный шортс (v2) + мультики через день

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 11:00 по времени пользователя (UTC+3)
  # Через день: чётный день — «Слово дня» (этот конвейер, shorts_v2), нечётный — мультик-диалог
  # из tg-promo-agent (shorts/episodes/dialog_NNN.json, с озвучкой). Очередь мультиков — cartoons_state.json.
  workflow_dispatch:        # + кнопка ручного запуска

permissions:
  contents: write           # коммитим shorts2_state.json обратно

concurrency:
  group: shorts2-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем ffmpeg и шрифты (кириллица + арабская вязь)
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && \
            sudo apt-get install -y -q --no-install-recommends \
              ffmpeg fonts-noto-core fonts-dejavu-core && break
            echo "попытка $i не удалась, жду 20 сек..."; sleep 20
          done
          ffmpeg -version | head -1

      - name: Чей сегодня день — «Слово дня» или мультик?
        id: day
        run: |
          if [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then echo "kind=word" >> "$GITHUB_OUTPUT"; else echo "kind=cartoon" >> "$GITHUB_OUTPUT"; fi
          echo "Сегодня: $(( $(date -u +%s) / 86400 % 2 ))"

      - name: Устанавливаем python-библиотеки
        run: pip install pillow arabic-reshaper python-bidi requests edge-tts numpy

      - name: Забираем мультики из tg-promo-agent
        if: steps.day.outputs.kind == 'cartoon'
        uses: actions/checkout@v4
        with:
          repository: tomasaloi1955-crypto/tg-promo-agent
          path: cartoons

      - name: Мультик дня → YouTube (и Instagram, если подключён)
        if: steps.day.outputs.kind == 'cartoon'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_MADE_FOR_KIDS: "true"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_GRAPH_HOST: ${{ secrets.IG_API_HOST || 'graph.instagram.com' }}
          TG_CHANNEL: myarabicl
        run: |
          sudo apt-get install -y -q --no-install-recommends libfribidi0 libraqm0 || true
          python cartoons/shorts/autopost.py --only youtube,instagram --kinds new --state cartoons_state.json

      - name: Собираем шортс дня и постим на YouTube
        if: steps.day.outputs.kind == 'word'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Instagram Reels и TikTok — см. cross_post.py; без секретов пропуск
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ secrets.IG_API_HOST }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_DIRECT: ${{ secrets.TIKTOK_DIRECT }}
        run: python autopost_shorts2.py

      - name: Сохраняем журнал публикаций
        run: |
          git config user.name "autopost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add shorts2_state.json cartoons_state.json 2>/dev/null || git add shorts2_state.json
          git diff --cached --quiet || git commit -m "Шортс опубликован, очередь +1"
          git push
