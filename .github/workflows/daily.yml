name: Ежедневный урок на все площадки

on:
  schedule:
    - cron: "0 7 * * *"   # каждый день в 07:00 UTC = 10:00 МСК
  workflow_dispatch:        # + кнопка ручного запуска

permissions:
  contents: write           # чтобы коммитить state.json обратно

concurrency:
  group: daily-post         # два запуска никогда не идут одновременно
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем ffmpeg и шрифты (арабский + эмодзи)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji

      - name: Устанавливаем python-библиотеки
        run: pip install edge-tts pillow arabic-reshaper python-bidi requests

      - name: Собираем урок дня и постим
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
        run: python social_post.py

      - name: Сохраняем счётчик уроков
        run: |
          git config user.name "autopost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Урок опубликован, счётчик +1"
          git push
